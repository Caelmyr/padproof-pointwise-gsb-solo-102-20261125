name: solo105-padproof
services:
  desk:
    build:
      context: .
      args:
        PAD_RUNTIME_IMAGE: ${PAD_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${PAD_IMAGE:-solo105-padproof:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${PAD_PORT:-19905}:8000"
    volumes:
      - pad-data:/var/lib/padproof
    healthcheck:
      test: ["CMD", "python", "-B", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/pad/health', timeout=3).status==200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  pad-data:
